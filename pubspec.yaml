name: baloot_game
description: Royal Baloot — A premium VIP card game experience by Antigravitty.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  animate_do: ^3.3.4
  provider: ^6.1.2
  shimmer: ^3.0.0
  playing_cards: ^0.4.1+11
  image: ^4.8.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/baloot_logo.png
    - assets/images/cards/
    - assets/images/avatars/
    - assets/icons/
    - assets/lottie/
    - assets/figma/
    - assets/audio/en/voice1/
    - assets/audio/ar/voice1/
    - assets/audio/effects/

  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 800
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 900
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
